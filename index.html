<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirección de reseñas</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff;
    }
    .loader {
      width: 60px;
      height: 60px;
      position: relative;
    }
    .dot {
      width: 12px;
      height: 12px;
      background: #3498db;
      border-radius: 50%;
      position: absolute;
      animation: bounce 0.6s infinite alternate;
    }
    .dot:nth-child(1) { left: 0; animation-delay: 0s; }
    .dot:nth-child(2) { left: 20px; animation-delay: 0.2s; }
    .dot:nth-child(3) { left: 40px; animation-delay: 0.4s; }

    @keyframes bounce {
      from { top: 0; }
      to { top: -20px; }
    }
  </style>
  <script>
    const mapping = {
      "A1Z4QX189932": "https://search.google.com/local/writereview?placeid=ChIJF2AHl7rSoZURYrHdjQ3BR5Q",
      //"A1Y2KF188170": "https://search.google.com/local/writereview?placeid=OTRO_PLACE_ID"
    };

    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const fileName = params.get("fileName");

      if (fileName && mapping[fileName]) {
        setTimeout(() => {
          window.location.href = mapping[fileName];
        }, 800); // menos de 1 segundo
      } else {
        document.body.innerHTML = "<h2>No se encontró negocio asociado</h2>";
      }
    };
  </script>
</head>
<body>
  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
