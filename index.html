<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirección de reseñas</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
    }
    .spinner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 8px solid transparent;
      border-top: 8px solid #4285F4;
      border-right: 8px solid #EA4335;
      border-bottom: 8px solid #FBBC05;
      border-left: 8px solid #34A853;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const placeid = params.get("placeid");

      if (placeid) {
        setTimeout(() => {
          window.location.href = "https://search.google.com/local/writereview?placeid=" + placeid;
        }, 600); // rápido
      } else {
        document.body.innerHTML = "<h2 style='color:white'>No se encontró negocio asociado</h2>";
      }
    };
  </script>
</head>
<body>
  <div class="spinner"></div>
</body>
</html>
