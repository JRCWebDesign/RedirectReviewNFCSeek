<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirección</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff;
    }
    .face {
      width: 80px;
      height: 80px;
      background: #ffeb3b;
      border-radius: 50%;
      position: relative;
      animation: pulse 0.8s infinite alternate;
    }
    .eye {
      width: 12px;
      height: 12px;
      background: #333;
      border-radius: 50%;
      position: absolute;
      top: 25px;
    }
    .eye.left { left: 20px; }
    .eye.right { right: 20px; }
    .mouth {
      width: 40px;
      height: 20px;
      border-bottom: 4px solid #333;
      border-radius: 0 0 40px 40px;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }
  </style>
  <script>
    const mapping = {
      "A1Z4QX189932": "https://search.google.com/local/writereview?placeid=ChIJF2AHl7rSoZURYrHdjQ3BR5Q",
      //"A1Y2KF188170": "https://search.google.com/local/writereview?placeid=OTRO_PLACE_ID"
    };

    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const fileName = params.get("fileName");

      if (fileName && mapping[fileName]) {
        setTimeout(() => {
          window.location.href = mapping[fileName];
        }, 800); // menos de 1 segundo
      } else {
        document.body.innerHTML = "<h2>No se encontró negocio asociado</h2>";
      }
    };
  </script>
</head>
<body>
  <div class="face">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
  </div>
</body>
</html>
