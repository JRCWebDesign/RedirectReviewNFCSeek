<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirección de reseñas</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff;
    }
    .spinner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 8px solid transparent;
      border-top: 8px solid #4285F4; /* Azul */
      border-right: 8px solid #EA4335; /* Rojo */
      border-bottom: 8px solid #FBBC05; /* Amarillo */
      border-left: 8px solid #34A853; /* Verde */
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    const mapping = {
      "A1Z4QX189932": "https://search.google.com/local/writereview?placeid=ChIJF2AHl7rSoZURYrHdjQ3BR5Q",
      //"A1Y2KF188170": "https://search.google.com/local/writereview?placeid="
    };

    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const fileName = params.get("fileName");

      if (fileName && mapping[fileName]) {
        setTimeout(() => {
          window.location.href = mapping[fileName];
        }, 500); // medio segundo
      } else {
        document.body.innerHTML = "<h2>No se encontró negocio asociado</h2>";
      }
    };
  </script>
</head>
<body>
  <div class="spinner"></div>
</body>
</html>
